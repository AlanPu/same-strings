<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111110">
<title>同弦 · 参照</title>
<style>
:root {
  --bg: #111110;
  --panel: #1a1917;
  --panel-2: #211f1c;
  --line: #2c2a26;
  --line-strong: #3d3a34;
  --text: #ece8df;
  --muted: #a09a8e;
  --faint: #6e685e;
  --gold: #c8a24a;
  --gold-dim: #3a3020;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  padding: max(18px, env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  max-width: 880px; margin: 0 auto;
}
h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; letter-spacing: 0.01em; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.tabs button {
  flex: 1; appearance: none; background: var(--panel); color: var(--muted);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 8px;
  font: inherit; font-size: 15px; cursor: pointer;
}
.tabs button.on { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }

video { width: 100%; border-radius: 14px; background: #000; display: block; }

.list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.row {
  appearance: none; width: 100%; text-align: left; display: flex; align-items: center;
  gap: 13px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 13px; padding: 12px 14px; color: var(--text); font: inherit; cursor: pointer;
}
.row:active { background: var(--panel-2); border-color: var(--line-strong); }
.row.on { border-color: var(--gold); background: var(--gold-dim); }
.no {
  width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px;
  border: 1px solid var(--line-strong); color: var(--muted); font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.row.on .no { border-color: var(--gold); color: var(--gold); }
.name { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.name b { font-weight: 500; font-size: 16px; }
.name i { font-style: normal; font-size: 12.5px; color: var(--faint); }
.dur { color: var(--faint); font-size: 12.5px; }

.timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.tl-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.tl-pos { font-size: 20px; color: var(--gold); }
.tl-mov { font-size: 12.5px; color: var(--muted); }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px; background: var(--line-strong);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--gold); margin-top: -8px; border: none;
}
.marks { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); margin-top: 2px; }

/* 滑块两侧的按段跳转：40px 见方，拇指够得着，又不会把滑块挤得太短 */
.steprow { display: flex; align-items: center; gap: 10px; }
.steprow input[type=range] { flex: 1; min-width: 0; }
.stepbtn {
  flex: 0 0 40px; width: 40px; height: 40px; padding: 0;
  appearance: none; background: var(--panel-2); color: var(--muted);
  border: 1px solid var(--line-strong); border-radius: 11px;
  font: inherit; font-size: 22px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.stepbtn:active { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }

/* 「每次听几秒」：只放数字，单位在左边的标签里说一次，省宽度 */
.durrow { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.durrow .tl-mov { flex: 0 0 auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  appearance: none; background: var(--panel); color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px;
  min-width: 40px; padding: 7px 11px;
  font: inherit; font-size: 13.5px; line-height: 1.2; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip.on { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }

.actions { display: flex; gap: 10px; margin-bottom: 14px; }
.btn {
  flex: 1; appearance: none; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  font: inherit; font-size: 15px; cursor: pointer;
}
.btn.primary { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }
.btn:active { background: var(--panel-2); }
.btn.small { flex: 0 0 auto; padding: 9px 14px; font-size: 13.5px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick {
  appearance: none; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px;
  font: inherit; font-size: 15px; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 10px;
}
.pick:active { background: var(--panel-2); }
.pick.on { border-color: var(--gold); background: var(--gold-dim); color: var(--gold); }
.pick .k {
  width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted);
}
.pick.on .k { border-color: var(--gold); color: var(--gold); }

.hint { color: var(--faint); font-size: 12.5px; line-height: 1.6; margin: 14px 0 0; }
@media (max-width: 560px) {
  .grid { grid-template-columns: 1fr; }
  h1 { font-size: 20px; }
}
</style>
</head>
<body>
<h1>同弦 · 参照</h1>
<p class="sub" id="sub"></p>

<div class="tabs">
  <button data-tab="listen" class="on">完整听</button>
  <button data-tab="compare">同一句对比</button>
</div>

<section id="tab-listen">
  <video id="player" controls playsinline preload="metadata"></video>
  <p class="hint" id="skipNote"></p>
  <div class="list" id="rows"></div>
  <p class="hint">点一位就开始播。8 个版本用的是同一份曲目，速度与处理各不相同 —— 听的时候留意：揉弦的密度、换弓的棱角、句尾怎么收。<br>
    有的录像开头是十几秒到半分钟的静场（就位、观众入场），点开时会自动跳过，并提示跳了多少；想从第一帧看就把进度条拖回 0:00。</p>
</section>

<section id="tab-compare" hidden>
  <div class="timeline">
    <div class="tl-head">
      <span class="tl-pos mono" id="posLabel">0:00</span>
      <span class="tl-mov" id="movLabel">第一乐章</span>
    </div>
    <div class="steprow">
      <button class="stepbtn" id="prevSeg" aria-label="上一段">‹</button>
      <input type="range" id="pos" min="0" max="100" value="0" step="1">
      <button class="stepbtn" id="nextSeg" aria-label="下一段">›</button>
    </div>
    <div class="marks" id="marks"></div>
  </div>
  <div class="durrow">
    <span class="tl-mov">每次听几秒</span>
    <div class="chips" id="segs"></div>
  </div>
  <div class="actions">
    <button class="btn primary" id="cycle">轮播 8 个版本</button>
    <button class="btn small" id="stop">停</button>
  </div>
  <div class="grid" id="picks"></div>
  <p class="hint">拖动时间轴选一个位置，然后点任意一位 —— 播放的是<b>同一段乐句</b>在他那里的对应位置（按对齐表换算，不是同一个秒数）。轮播会依次换上 8 个人，同一句话连听八遍。<br>
    「每次听几秒」决定听多长：调好秒数后，‹ › 就按同样的步长前后挪一段，位置会留在原地，可以一段一段接着往下捋。</p>
</section>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var P = D.performers;
  var W = D.warp;
  var STEP = D.warpStep || 0.5;
  var SEG_PRESETS = [4, 6, 8, 12, 16, 20, 30];
  var segSec = 8;         // 对比模式每段听几秒，chips 可改，记在本机

  function mmss(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* 锚点时间 → 该演奏家音轨上的时间（线性插值，与后端 warp.at 一致） */
  function at(pid, t) {
    var w = W[pid];
    if (!w || !w.map || !w.map.length) return t;
    var x = t / STEP;
    var i = Math.floor(x);
    if (i < 0) return w.map[0];
    if (i >= w.map.length - 1) return w.map[w.map.length - 1];
    var f = x - i;
    return w.map[i] + (w.map[i + 1] - w.map[i]) * f;
  }

  document.getElementById('sub').textContent =
    D.work + ' · ' + P.length + ' 位演奏家 · 参照时间轴 ' + mmss(D.duration);

  /* 时间轴刻度按实际长度分四档，不写死 —— 曲子换了也不用改模板 */
  (function () {
    var marks = document.getElementById('marks');
    var cells = [];
    for (var k = 0; k <= 3; k++) {
      cells.push('<span>' + mmss(D.duration * k / 3) + '</span>');
    }
    marks.innerHTML = cells.join('');
  })();

  /* ---------- 完整听 ---------- */
  var player = document.getElementById('player');
  var skipNote = document.getElementById('skipNote');
  /* 跳到音乐起点必须等 metadata：src 刚设好时 duration 还是 NaN，seek 会被丢掉。
     用 pendingSeek 记住「下一个 metadata 就跳到这里」，避免在加载中硬设 currentTime。 */
  var pendingSeek = -1;
  player.addEventListener('loadedmetadata', function () {
    if (pendingSeek >= 0) {
      try { player.currentTime = pendingSeek; } catch (e) { /* 个别机型会抛 */ }
      pendingSeek = -1;
    }
  });
  var rows = P.map(function (p, i) {
    return '<button class="row" data-i="' + i + '">' +
      '<span class="no mono">' + (i + 1) + '</span>' +
      '<span class="name"><b>' + esc(p.display) + '</b><i>' + esc(p.fullName) + '</i></span>' +
      '<span class="dur mono">' + mmss(p.videoSec || D.duration) + '</span>' +
      '</button>';
  }).join('');
  document.getElementById('rows').innerHTML = rows;

  document.getElementById('rows').addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-i]');
    if (!el) return;
    var i = +el.getAttribute('data-i');
    var p = P[i];
    // musicStart 由构建期实测（见 tools/make_ref.py）。哈德利希 21 秒、
    // 文格洛夫 31 秒、穆特 36 秒的开头几乎是静音，不跳过去会让人以为「没声音」。
    var ms = p.musicStart || 0;
    var want = ms > 0 ? Math.max(0, ms - 2) : 0;   // 退 2 秒，别正好切在起音上
    var src = 'video/' + p.id + '.mp4';
    var same = !!(player.currentSrc && player.currentSrc.indexOf(src) >= 0);

    Array.prototype.forEach.call(this.children, function (c) { c.classList.remove('on'); });
    el.classList.add('on');

    player.pause();
    if (same) {
      // 同一个源被再次点击：重新加载不会触发 loadedmetadata，直接定位
      try {
        player.currentTime = want;
        pendingSeek = -1;
      } catch (e) {
        pendingSeek = want > 0 ? want : -1;   // 元数据没就绪，交给 loadedmetadata
      }
    } else {
      pendingSeek = want > 0 ? want : -1;
      player.src = src;
    }
    player.play().catch(function () {});
    skipNote.textContent = want > 0
      ? '已跳过开场 ' + mmss(want) + '（静场/掌声）· 拖回 0:00 可看开头'
      : '';
  });

  /* ---------- 同一句对比 ---------- */
  var total = D.duration;
  var pos = document.getElementById('pos');
  var posLabel = document.getElementById('posLabel');
  var movLabel = document.getElementById('movLabel');
  var picks = document.getElementById('picks');
  var audios = [];
  var cur = -1;
  var timer = null;
  var gapTimer = null;
  var cycle = false;

  /* 时间轴按「秒」走，不再用 0–100 的百分比 —— 百分比一格约 16 秒，太粗，
     ‹ › 也没法按你选的秒数精确挪。总长带小数时 max 取整，末端误差 < 1 秒。 */
  pos.min = 0;
  pos.max = Math.round(total);
  pos.step = 1;
  pos.value = 0;

  picks.innerHTML = P.map(function (p, i) {
    return '<button class="pick" data-i="' + i + '">' +
      '<span class="k mono">' + (i + 1) + '</span><span>' + esc(p.display) + '</span></button>';
  }).join('');

  /* ---------- 每段听几秒 ---------- */
  var segsEl = document.getElementById('segs');
  function renderSegs() {
    segsEl.innerHTML = SEG_PRESETS.map(function (s) {
      return '<button class="chip' + (s === segSec ? ' on' : '') +
        '" data-seg="' + s + '" aria-pressed="' + (s === segSec) + '">' + s + '</button>';
    }).join('');
    document.getElementById('cycle').textContent =
      '轮播 ' + P.length + ' 个版本（各 ' + segSec + ' 秒）';
  }
  try {
    var savedSeg = parseInt(localStorage.getItem('ss.segSec'), 10);
    // 只认预设值：预设表改过之后，旧存档里的数字可能已经不在列表里
    if (savedSeg && SEG_PRESETS.indexOf(savedSeg) >= 0) segSec = savedSeg;
  } catch (e) { /* 隐私模式下 localStorage 会抛，忽略 */ }
  renderSegs();

  segsEl.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-seg]');
    if (!el) return;
    var s = +el.getAttribute('data-seg');
    if (s === segSec) return;
    segSec = s;
    renderSegs();
    try { localStorage.setItem('ss.segSec', String(s)); } catch (e) { /* 同上 */ }
    if (cur >= 0) playOne(cur, null);    // 正在听就按新时长从当前位置重来
  });

  P.forEach(function (p) {
    var a = document.createElement('audio');
    a.preload = 'metadata';
    a.src = 'audio/' + p.id + '.m4a';
    audios.push(a);
  });

  function stopAudio() {
    clearTimeout(timer);
    timer = null;
    audios.forEach(function (a) { a.pause(); });
  }

  /* iOS 的自动播放策略：play() 必须紧跟用户手势。轮播时第 2 个以后是在 setTimeout
     里播的，没有手势，会被静默拒绝。解法是在第一次手势里把 8 个元素都「解锁」一遍
     —— 静音播一下再暂停，元素就被标记为已获授权，之后定时器里也能播。
     跳过 skip 这个元素，避免解锁的 play/pause 把紧接着要正式播的那一路掐掉。 */
  var unlocked = false;
  function unlockAll(skip) {
    if (unlocked) return;
    unlocked = true;
    audios.forEach(function (a, k) {
      if (k === skip) return;
      a.muted = true;
      var pr = a.play();
      if (pr && pr.then) {
        pr.then(function () {
          a.pause();
          a.muted = false;
          try { a.currentTime = 0; } catch (e) { /* 元数据未就绪 */ }
        }, function () { a.muted = false; });
      } else {
        a.muted = false;
      }
    });
  }

  function stopAll() {
    cycle = false;
    clearTimeout(gapTimer);
    gapTimer = null;
    stopAudio();
    cur = -1;
    Array.prototype.forEach.call(picks.children, function (c) { c.classList.remove('on'); });
  }

  function playOne(i, then) {
    stopAudio();
    var t = +pos.value;
    var a = audios[i];
    cur = i;
    Array.prototype.forEach.call(picks.children, function (c, k) {
      c.classList.toggle('on', k === i);
    });
    var target = at(P[i].id, t);
    var go = function () {
      try { a.currentTime = target; } catch (e) { /* metadata 未就绪时忽略 */ }
      a.play().catch(function () {});
      timer = setTimeout(function () {
        a.pause();
        if (then) then();
      }, segSec * 1000);
    };
    if (a.readyState >= 1) go();
    else a.addEventListener('loadedmetadata', function once() {
      a.removeEventListener('loadedmetadata', once);
      go();
    });
  }

  picks.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-i]');
    if (!el) return;
    var i = +el.getAttribute('data-i');
    stopAll();
    unlockAll(i);          // 必须在手势里，且和解锁目标之外的元素互不干扰
    playOne(i, null);
  });

  /* 轮播：同一句连听八遍，中间留 0.4 秒让耳朵落一下 */
  document.getElementById('cycle').addEventListener('click', function () {
    stopAll();
    unlockAll(0);
    cycle = true;
    (function next(i) {
      if (!cycle || i >= P.length) { cycle = false; return; }
      playOne(i, function () {
        if (!cycle) return;
        gapTimer = setTimeout(function () { next(i + 1); }, 400);
      });
    })(0);
  });

  document.getElementById('stop').addEventListener('click', stopAll);

  function showPos() {
    var t = +pos.value;
    posLabel.textContent = mmss(t);
    var m = D.movements.find(function (x) { return t >= x.start && t < x.end; });
    movLabel.textContent = (m && m.label) || '';
  }
  pos.addEventListener('input', showPos);
  /* 松手才重播：拖动过程中连续 seek 会把人听晕 */
  pos.addEventListener('change', function () {
    showPos();
    if (cur >= 0) playOne(cur, null);
  });
  showPos();

  /* ‹ › 按「你选的秒数」挪一段，而不是固定跳 30 秒 —— 这样听到哪、停在哪都和前一段对齐，
     接着往下连听就是连续的曲子了。到两端就夹住，不会越界成负时间。 */
  function stepBy(delta) {
    var was = cur;                 // 轮播中手动挪段：先退出轮播，否则链路会错位
    if (cycle) stopAll();
    var t = Math.min(total, Math.max(0, (+pos.value) + delta));
    pos.value = Math.round(t);
    showPos();
    if (was >= 0) playOne(was, null);
  }
  document.getElementById('prevSeg').addEventListener('click', function () { stepBy(-segSec); });
  document.getElementById('nextSeg').addEventListener('click', function () { stepBy(+segSec); });

  /* ---------- tab ---------- */
  document.querySelector('.tabs').addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-tab]');
    if (!el) return;
    showTab(el.getAttribute('data-tab'));
  });

  function showTab(name) {
    Array.prototype.forEach.call(document.querySelector('.tabs').children, function (c) {
      c.classList.toggle('on', c.getAttribute('data-tab') === name);
    });
    document.getElementById('tab-listen').hidden = name !== 'listen';
    document.getElementById('tab-compare').hidden = name !== 'compare';
    if (name === 'listen') stopAll();
    else player.pause();     // 切到对比时别让视频在后台继续响
    // 用 replaceState 而不是改 location.hash：后者会多出历史记录、还会跳滚动位置
    try {
      history.replaceState(null, '', name === 'compare' ? '#compare' : location.pathname);
    } catch (e) { /* file:// 下可能被拒，无所谓 */ }
  }

  /* tab 写进 hash：刷新后仍停在原来的位置，也方便直接把「同一句对比」发给别人 */
  if (location.hash === '#compare') showTab('compare');
})();
</script>
</body>
</html>
