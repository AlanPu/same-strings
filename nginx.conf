# 同弦 · 静态托管配置（HTTPS）
#
# 两个服务拆成两个端口，互不干扰：
#   443  → 练习器（dist/site，打进镜像）          NAS 上映射成 25001
#   8443 → 参照页（dist/ref，挂载进容器，可选）    NAS 上映射成 25002
#
# 换了协议，端口号本身不变（NAS 侧仍是 25001/25002），只是 URL 里的 http 变成 https。
# 容器内之所以不直接听 443：NAS 自己的 443 被 DSM 登录页占着，宿主机只能映射到高位端口。
#
# 为什么不共用 443 加 /ref/ 子路径：参照页里的引用全是相对路径（video/xxx.mp4、
# audio/xxx.m4a），挂在 /ref/ 下就得为 /ref/video/ 和 /ref/audio/ 各写一份 MIME 规则，
# 与练习器的 /audio/ 规则重复；两处一旦漂移，症状是「只有一个页面放不出声」，
# 极难查。现在是同一个根，参照页的 /video/、/audio/ 直接落在根下，只有一份规则。
#
# 这个站点的全部难点集中在一件事：**音频必须能被 iOS Safari 的 <audio> 按段取用**。
# 具体说，Safari 打开 m4a 时会先发一个 Range 请求探测，再按需续取；
# 如果服务器只回 200 全量、或返回错的 Content-Type，表现是「点了播放没反应」或「播一半卡住」。
#
# 三条硬要求：
#   ① .m4a 必须是 audio/mp4（nginx 自带的 mime.types 不一定收录 m4a，
#      漏了就会退回 application/octet-stream，Safari 直接拒绝播放）；
#   ② 支持 Range → 206（nginx 对静态文件默认支持，这里显式声明 Accept-Ranges 并禁用压缩）；
#   ③ 不要对 m4a 做 gzip —— 一是 AAC 已经压过，二是压缩会破坏 Range 分段。

# ---- TLS 公共参数（http 上下文，两个 server 共用）----
# 证书和私钥从宿主机挂载进 /etc/nginx/certs，绝不 COPY 进镜像 ——
# 镜像会被推到仓库或私有 registry，私钥进去就等于泄露。
ssl_protocols        TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache    shared:SSL:10m;
ssl_session_timeout  1d;
ssl_session_tickets  off;

# 没有加 HSTS：*.alanpu.top 不只这一个用途，一旦下发 HSTS，浏览器会在有效期内
# 强制 https，别的服务（哪怕是临时 http 调试）都会被顶掉。确认这域名只服务本站再说。

# ============================================================
# 练习器
# ============================================================
server {
    listen 443 ssl;
    http2 on;                     # nginx ≥1.25.1 的新写法，不再用 listen ... http2
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 必须是 fullchain：只给叶子证书，iOS 会报「链不完整」并直接拒连
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    server_tokens off;
    charset utf-8;

    # 页面与代码每次都回源校验，避免 iPad 上缓存住旧版本。
    # 注意 nginx 的 add_header 继承规则：子块里只要出现一个 add_header，
    # 就不再继承父级的任何一个 —— 所以 /audio/ 那里必须自己再声明一次缓存策略。
    add_header Cache-Control "no-cache" always;

    # ---- 健康检查（Docker HEALTHCHECK 用）----
    # 容器内只能走 127.0.0.1，和证书里的域名对不上，所以探测时要跳过证书校验
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 音频：长缓存 + 支持 Range ----
    location /audio/ {
        # 清空继承的类型表，让下面的 default_type 生效，避免 m4a 落到 octet-stream
        types { }
        default_type audio/mp4;

        add_header Accept-Ranges bytes always;
        # 片段文件名由构建期编号决定，内容永不变更 → 可以永久缓存
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # 必须关掉：压缩会破坏 Range 分段，iOS 上表现为拖动失效
        gzip off;

        # 只允许 GET/HEAD，静态站点不需要别的
        limit_except GET HEAD { deny all; }
    }

    # ---- 页面与代码：走 server 级的 no-cache，这里不再写 add_header ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 只压文本，不碰音频 ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    # 日志给 NAS 上的容器日志用，保留默认即可
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}

# ============================================================
# 参照页（3.1 GB 视频从宿主机目录挂进来，没挂就是 404）
# ============================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html/ref;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    server_tokens off;
    charset utf-8;

    # index.html 每次回源校验：改了模板要能立刻看到
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 视频：iOS 对 <video> 的 MIME 比 <audio> 更挑，落 octet-stream 会一直转圈 ----
    location /video/ {
        types { }
        default_type video/mp4;

        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        gzip off;
        limit_except GET HEAD { deny all; }
    }

    # ---- 对比音轨 ----
    location /audio/ {
        types { }
        default_type audio/mp4;

        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        gzip off;
        limit_except GET HEAD { deny all; }
    }

    # 用 =404 而不是回落到 /index.html：挂载目录漏了的时候，回落会让根路径
    # 静默返回参照页骨架（或者更糟，让人以为是练习器），看起来像「参照页坏了」，
    # 其实是「没挂载」
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
