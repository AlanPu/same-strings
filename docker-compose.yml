services:
  same-strings:
    build: .
    image: same-strings:latest
    container_name: same-strings
    restart: unless-stopped
    ports:
      # 左边是 NAS 上的端口，冲突了就改这个
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
