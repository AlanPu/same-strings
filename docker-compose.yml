services:
  same-strings:
    build: .
    image: same-strings:latest
    container_name: same-strings
    restart: unless-stopped
    # 目标架构。NAS 绝大多数是 x86_64，所以默认 linux/amd64 —— 在 arm64 的 Mac 上
    # 交叉构建出来的镜像也靠这一行保证「跑的就是 amd64 那份」。
    # 在 Apple Silicon 上本地试跑（不用模拟）时：
    #   TARGET_PLATFORM=linux/arm64 docker compose up -d
    platform: ${TARGET_PLATFORM:-linux/amd64}
    ports:
      # 两个服务走两个端口，互不影响（协议是 HTTPS）：
      #   25001 → 容器的 443  → 练习器
      #   25002 → 容器的 8443 → 参照页（没挂载 ref/ 就是 404，练习器不受影响）
      # 想换端口就改 .env 里的 PORT / REF_PORT，不用改这个文件。
      # 宿主机侧不能直接用 443：那个被 DSM 登录页占着。
      - "${PORT:-25001}:443"
      - "${REF_PORT:-25002}:8443"
    volumes:
      # 参照页（8 个原视频 + 对比音轨，约 3.1 GB）不进镜像，而是从宿主机目录挂进来。
      # 这样镜像仍然只有 150 MB 左右，视频换了也不用重新 build。
      #
      # 默认指向本机的 ./dist/ref，在 NAS 上通常要改成共享文件夹的绝对路径，例如：
      #   Synology  REF_DIR=/volume1/docker/same-strings/ref
      #   群晖/威联通也常见 /share/… 或 /mnt/…，按你自己的共享目录填
      # 可以在同目录的 .env 里写一行 REF_DIR=…，或直接 export 后 compose。
      #
      # 不想用参照页就把这段整个删掉 —— 练习器照常工作，/ref/ 返回 404。
      - "${REF_DIR:-./dist/ref}:/usr/share/nginx/html/ref:ro"
      # 直接挂 DSM 的证书库（不是拷出来的副本）：续签后内容实时可见。
      # 容器启动时由 /docker-entrypoint.d/40-sync-dsm-cert.sh 拷到 /etc/nginx/certs。
      # 只读挂载；证书文件是 root:r--------，容器主进程以 root 启动才读得到。
      # 本机没有 DSM 时可用 DSM_CERT_DIR=./certs 指向自己的证书目录。
      - "${DSM_CERT_DIR:-/usr/syno/etc/certificate/system/default}:/dsm-certs:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
